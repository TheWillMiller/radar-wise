name: Frontend Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  syntax:
    runs-on: "ubuntu-latest"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled card
        run: npm run build:check

      - name: JavaScript syntax check
        run: npm run check

      - name: Configuration behavior tests
        run: npm test
