<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="referrer" content="no-referrer">
    <title>RadarWise browser smoke test</title>
    <style>
      #preview { display: block; width: 480px; height: 270px; }
    </style>
  </head>
  <body>
    <main>
      <p id="status">Loading RadarWise...</p>
      <section id="preview"></section>
    </main>
    <script type="module">
      import "../radarwise-card.js";

      const card = document.createElement("radarwise-card");
      await card._loadLeaflet();
      card.setConfig({
        type: "custom:radarwise-card",
        entity: "weather.home",
        theme_mode: "dark",
        content_mode: "essentials",
        show_environment: false,
        show_radar: false
      });
      const preview = document.getElementById("preview");
      const previewRoot = preview.attachShadow({ mode: "open" });
      previewRoot.innerHTML = `<style>${card._styles()}</style><div id="map" style="width:100%;height:100%"></div>`;
      const map = window.L.map(previewRoot.getElementById("map"), { zoomControl: false });
      map.setView([33.688, -78.886], 7);
      const basemap = card._basemap("light");
      if (basemap.url.includes("cartocdn.com")) throw new Error("CARTO raster tiles are still configured");
      if (basemap.options.referrerPolicy !== "origin") {
        throw new Error(`OpenStreetMap referrer policy is ${basemap.options.referrerPolicy || "missing"}`);
      }
      const tileLayer = window.L.tileLayer(basemap.url, basemap.options).addTo(map);
      await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error("OpenStreetMap basemap tiles did not load")), 10000);
        tileLayer.once("tileload", () => {
          clearTimeout(timeout);
          resolve();
        });
      });
      const noaaLayer = card._noaaLayer(new Date(), { opacity: 0.9 }).addTo(map);
      await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error("NOAA quality-controlled precipitation radar tiles did not load")), 15000);
        noaaLayer.once("tileload", () => {
          clearTimeout(timeout);
          resolve();
        });
      });
      document.body.append(card);
      card.hass = {
        states: {
          "weather.home": {
            state: "partlycloudy",
            last_updated: new Date().toISOString(),
            attributes: { temperature: 72, apparent_temperature: 75, supported_features: 3 }
          }
        },
        config: { latitude: 33.688, longitude: -78.886 },
        locale: { language: "en" },
        connection: { sendMessagePromise: async () => ({}) }
      };
      await Promise.resolve();
      const darkText = getComputedStyle(card).getPropertyValue("--ww-text").trim();
      const darkBackground = getComputedStyle(card.shadowRoot.querySelector(".card-outer")).backgroundImage;
      if (darkText !== "#f3f4f6" || !darkBackground.includes("linear-gradient")) {
        throw new Error(`RadarWise Dark did not render correctly: text=${darkText}, background=${darkBackground}`);
      }
      const currentIcon = card.shadowRoot.querySelector(".current-icon svg");
      if (!currentIcon || currentIcon.getAttribute("viewBox") !== "0 0 64 64" || !currentIcon.classList.contains("ww-partly")) {
        throw new Error("The refreshed partly-cloudy weather artwork did not render");
      }
      if (currentIcon.querySelector("text, ellipse")) {
        throw new Error("The refreshed weather artwork regressed to text glyphs or flat ellipse clip art");
      }
      const cloudAnimation = getComputedStyle(currentIcon.querySelector(".ww-cloud")).animationName;
      if (cloudAnimation !== "ww-cloud-drift") {
        throw new Error(`The subtle cloud animation did not activate: ${cloudAnimation}`);
      }
      if (card.shadowRoot.querySelector(".temp-feels")?.textContent.trim() !== "Feels like 75°F") {
        throw new Error("The Home Assistant apparent temperature did not render as Feels like");
      }
      const tileImages = [...previewRoot.querySelectorAll("img.leaflet-tile")];
      const basemapTiles = tileImages.filter((tile) => new URL(tile.src).hostname === "tile.openstreetmap.org");
      if (!basemapTiles.length) {
        throw new Error("OpenStreetMap basemap tiles were not rendered");
      }
      if (basemapTiles.some((tile) => tile.referrerPolicy !== "origin")) {
        throw new Error("Leaflet did not apply the origin-only referrer policy to OpenStreetMap tile images");
      }
      const noaaTiles = [...previewRoot.querySelectorAll('canvas[data-radarwise-layer="noaa-precipitation"]')];
      if (!noaaTiles.length) {
        throw new Error("NOAA quality-controlled precipitation radar canvases were not rendered");
      }
      if (!noaaTiles.some((tile) => Number(tile.dataset.filteredPixels) > 0)) {
        throw new Error("NOAA weak blue echoes were not filtered from the traditional precipitation view");
      }
      const remainingWeakEchoes = noaaTiles.reduce((total, tile) => {
        const pixels = tile.getContext("2d").getImageData(0, 0, tile.width, tile.height).data;
        for (let index = 0; index < pixels.length; index += 4) {
          if (pixels[index + 3] && pixels[index] < 120 && pixels[index + 1] < 220 && pixels[index + 2] >= pixels[index + 1] - 20) total += 1;
        }
        return total;
      }, 0);
      if (remainingWeakEchoes) {
        throw new Error(`${remainingWeakEchoes} weak blue NOAA radar pixels remained visible`);
      }
      document.getElementById("status").textContent = `RadarWise ${window.customCards.at(-1).preview ? "preview " : ""}loaded with Leaflet ${window.L.version}, Feels like, OpenStreetMap, and NOAA quality-controlled precipitation radar`;
      document.body.dataset.smoke = "passed";
    </script>
  </body>
</html>
